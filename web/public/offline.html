<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0B" />
    <title>Offline</title>
    <!-- Eigenstaendige Datei, wird vom Service Worker vorgehalten. Keine externen
         Abhaengigkeiten, weil sie genau dann laedt, wenn kein Netz da ist. -->
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfbfa;
        --surface: #ffffff;
        --line: #e2e2de;
        --text: #111112;
        --text-2: #5a5a5e;
        --accent: #e33a16;
        --accent-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0a0a0b;
          --surface: #131315;
          --line: #2a2a2f;
          --text: #f2f2f0;
          --text-2: #a3a3a8;
          --accent: #ff4a24;
          --accent-ink: #0a0a0b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font: 400 0.9375rem/1.45 -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 30rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1.5rem;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font: 700 0.6875rem/1.2 -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-2);
      }
      .mark span {
        width: 1.25rem;
        height: 2px;
        background: var(--accent);
      }
      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.375rem;
        line-height: 1.15;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        max-width: 65ch;
        color: var(--text-2);
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 560 0.9375rem/1.2 -apple-system, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Kern Search<span></span></div>
      <h1>Keine Verbindung</h1>
      <p>
        Diese Seite liegt nicht im Zwischenspeicher. Bereits geoeffnete Ergebnisse und die
        zuletzt geladene Datenbank bleiben ohne Netz verfuegbar.
      </p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
